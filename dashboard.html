<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard | SecureBank</title><link rel="stylesheet" href="css/style.css"></head>
<body><header id="site-nav"></header>
<main class="container"><div class="page-title"><span class="eyebrow">User Workspace</span><h1>Hello, <span id="userName">Demo User</span></h1><p class="muted">This is sample data, not a real bank balance.</p></div><div class="stats"><div class="stat"><small>Demo Balance</small><strong>Rs. 125,000</strong></div><div class="stat"><small>Transactions</small><strong id="transactionCount">0</strong></div><div class="stat"><small>Flagged Items</small><strong id="flaggedCount">0</strong></div><div class="stat"><small>Security Score</small><strong>92/100</strong></div></div><div class="panel"><div class="footer-inner"><h2>Recent Transactions</h2><button class="btn secondary" id="logoutBtn">Logout</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Date</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody id="recentRows"></tbody></table></div><p><a class="inline-link" href="transactions.html">View all transactions →</a></p></div><div class="panel"><h2>Add a Demo Transaction</h2><form id="transactionForm" class="two-col"><div class="field"><label for="type">Transaction Type</label><select id="type"><option>Online Purchase</option><option>Utility Bill</option><option>ATM Withdrawal</option><option>Money Transfer</option></select></div><div class="field"><label for="amount">Amount (Rs.)</label><input id="amount" type="number" min="1" required placeholder="e.g. 2500"></div><div><button class="btn" type="submit">Add Demo Transaction</button></div></form><div id="transactionMessage"></div></div></main>
<footer id="site-footer"></footer><script src="js/main.js"></script><script src="js/dashboard.js"></script></body></html>
