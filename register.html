<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register | SecureBank</title><link rel="stylesheet" href="css/style.css"></head>
<body><header id="site-nav"></header>
<main class="container"><div class="form-wrap panel"><span class="eyebrow">Create Demo Profile</span><h1>Register</h1><p class="muted">Create a profile for this academic demo only.</p><form id="registerForm"><div class="field"><label for="name">Full Name</label><input id="name" required placeholder="Your name"></div><div class="field"><label for="regEmail">Email</label><input id="regEmail" type="email" required placeholder="student@example.com"></div><div class="field"><label for="regPassword">Demo Password</label><input id="regPassword" type="password" minlength="8" required placeholder="At least 8 characters"></div><button class="btn green" type="submit">Create Demo Profile</button></form><div id="formMessage" style="margin-top:14px"></div><p class="muted">Already have an account? <a class="inline-link" href="login.html">Login</a></p></div></main>
<footer id="site-footer"></footer><script src="js/main.js"></script><script src="js/auth.js"></script></body></html>
